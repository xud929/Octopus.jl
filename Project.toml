name = "Octopus"
uuid = "badbaa64-7004-4ad4-8ce5-525483dccda7"
version = "0.1.0"
authors = ["Derong Xu <xud929@gmail.com>"]

[deps]
Adapt = "79e6a3ab-5dfb-504d-930d-738a2a938a0e"
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
FFTW = "7a1cc6ca-52ef-59f5-83cd-3a7055c09341"
HDF5 = "f67ccb44-e63f-5c2f-98bd-6dc0ccc4ba2f"
InteractiveUtils = "b77e0a4c-d291-57a0-90e8-8db25a27a240"
JLD2 = "033835bb-8acc-5ee8-8aae-3f567f8a3819"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
NVTX = "5da4648a-3479-48b8-97b9-01cb529c0a1f"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
SpecialFunctions = "276daf66-3868-5448-9aa4-cd146d93841b"

[weakdeps]
ForwardDiff = "f6369f11-7733-5829-9624-2563aa707210"
MPI = "da04e1cc-30fd-572f-bb4f-1f8673147195"
Symbolics = "0c5d862f-8b57-4792-8d23-62f2024744c7"

[extensions]
OctopusForwardDiffExt = "ForwardDiff"
OctopusMPIExt = "MPI"
OctopusSymbolicsExt = "Symbolics"

[compat]
Adapt = "4.7.0"
CUDA = "6.2.1"
FFTW = "1"
HDF5 = "0.17"
InteractiveUtils = "1.11"
JLD2 = "0.6"
LinearAlgebra = "1.12"
NVTX = "1"
Random = "1.11"
SpecialFunctions = "2"
# Weak dependency (and test dep): ForwardDiff works on the generic code
# unaided almost everywhere; the OctopusForwardDiffExt extension supplies the
# two derivative rules generic code cannot express (the Faddeeva holomorphic
# rule and the near-round precision calibration pass-through, audit U7-1).
ForwardDiff = "1"
# Weak dependency (and test dep): OctopusMPIExt binds the multi-process
# policy's collective seam to MPI.jl. Core never imports it and keeps a
# serial passthrough, so a process without MPI is a communicator of one.
MPI = "0.20"
# Weak dependency: the knob tree's Symbolics adapter lives in
# OctopusSymbolicsExt and activates only when the user loads Symbolics.
Symbolics = "7"
julia = "1.12"

[extras]
CUDA_Runtime_jll = "76a88914-d11a-5bdc-97e0-2f5a05c973a2"
ForwardDiff = "f6369f11-7733-5829-9624-2563aa707210"
Logging = "56ddb016-857b-54e1-b83d-db4d58db5568"
MPI = "da04e1cc-30fd-572f-bb4f-1f8673147195"
MPICH_jll = "7cb0a576-ebde-5e09-9194-50597f1243b4"
Symbolics = "0c5d862f-8b57-4792-8d23-62f2024744c7"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

# MPICH_jll is here for its `mpiexec`, which the multi-process section
# launches; loading a jll does not activate OctopusMPIExt, so the parent
# suite stays a serial-passthrough process and its passthrough pins mean what
# they say. MPI itself is a test dep so the CHILD processes can resolve it.
[targets]
test = ["Test", "ForwardDiff", "Symbolics", "Logging", "MPI", "MPICH_jll"]
