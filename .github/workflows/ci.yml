name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Julia 1.12 CPU smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          # Pinned to one exact patch release while a flaky CI segfault is
          # under diagnosis (docs/todo.md, "CI segfault on Julia 1.12.6").
          # The rationale first recorded here — "the floating pin resolved to
          # 1.12.6 on 2026-08-12 and a green history flipped red" — was WRONG:
          # 1.12.6 was released 2026-04-10 and is still the newest 1.12.x, so
          # every run since this workflow's first day (2026-07-21) resolved
          # '1.12' to 1.12.6, ~330 of them green. The two segfaults
          # (2026-08-11 main, 2026-08-12 paper-cpc) are flaky: the second
          # one's commit had passed CI ten minutes earlier, and the two died
          # at different points in the suite. 1.12.4 is kept because it is
          # the binary every local gate runs, i.e. a freeze during diagnosis,
          # not a fix; loosen only after the crash is understood.
          version: '1.12.4'
      - uses: julia-actions/cache@v2
      - name: Instantiate project
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      # Threaded, deliberately. `CPUThreadsExecutionPolicy` fans particles out
      # over `Threads.@spawn`, and `_run_logical_workers` takes a single-worker
      # fast path that never spawns -- so a single-threaded run exercises the
      # concurrent code paths not at all. The aperture loss counter raced for
      # exactly that reason: the invariant `sum(loss_counts) == dead` was
      # already asserted and already passing, because CI only ever ran it with
      # one worker. Anything shared between workers needs more than one.
      - name: Run fast package tests
        run: julia --project=. --threads=4 -e 'using Pkg; Pkg.test(julia_args=["--threads=4"])'
