name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Julia 1.12 CPU smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          # Floating again (owner decision, 2026-08-14). The 2026-08-12 pin
          # to 1.12.4 froze the toolchain under a wrong diagnosis — the
          # "flip to 1.12.6" never happened; every run since this workflow's
          # first day resolved '1.12' to 1.12.6, ~330 green against two
          # flaky segfaults (same commit passed ten minutes before one of
          # them; different death points). The pin also held CI on a binary
          # LACKING 1.12.6's GC write-barrier fix (JuliaLang/julia#61120,
          # heap-corruption class) and threaded-region fix (#60822): it
          # traded a known-fixed silent-corruption class for avoiding a
          # ~0.6%-per-run visible flake. A flaky red is loud and re-runnable;
          # a write-barrier miss is neither.
          #
          # Operational note: a signal-11 red right after a testset summary,
          # passing everything printed, is the known flake — re-run it, and
          # tally the occurrence on the docs/todo.md "CI segfault" row (CI
          # statistics are the diagnosis instrument now; the crash has never
          # reproduced off CI, including 4 fresh-depot local 1.12.6 suites,
          # three of them pinned to 4 CPUs).
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Instantiate project
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      # Threaded, deliberately. `CPUThreadsExecutionPolicy` fans particles out
      # over `Threads.@spawn`, and `_run_logical_workers` takes a single-worker
      # fast path that never spawns -- so a single-threaded run exercises the
      # concurrent code paths not at all. The aperture loss counter raced for
      # exactly that reason: the invariant `sum(loss_counts) == dead` was
      # already asserted and already passing, because CI only ever ran it with
      # one worker. Anything shared between workers needs more than one.
      - name: Run fast package tests
        run: julia --project=. --threads=4 -e 'using Pkg; Pkg.test(julia_args=["--threads=4"])'
